<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>Chaos Rising — DarkRP</title>
<style>
:root { color-scheme: dark; --red: #ed1c2e; }
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050608; }
body { font-family: Arial, Helvetica, sans-serif; }
#artwork {
  position: fixed; inset: 0; width: 100%; height: 100%;
  object-fit: fill; display: block; user-select: none; pointer-events: none;
}
/* These two elements sit directly over the progress bar already present in the artwork. */
#progress-track {
  position: fixed; left: 2.78%; bottom: 9.22%; width: 23.55%; height: 2.43%;
  min-height: 10px; border: 1px solid rgba(230,230,230,.85); border-radius: 999px;
  padding: 2px; overflow: hidden; background: rgba(4,6,8,.98);
  box-shadow: 0 0 8px rgba(0,0,0,.45); z-index: 2;
}
#progress-fill {
  height: 100%; width: 7%; border-radius: 999px;
  background: linear-gradient(90deg, #b90e20, #ff2639);
  box-shadow: 0 0 10px rgba(237,28,46,.35);
  transition: width .55s ease;
}
#progress-percent {
  position: fixed; left: 27.55%; bottom: 8.83%; width: 4.55%; height: 2.55%;
  min-height: 12px; display: flex; align-items: center; justify-content: center;
  color: #f5f5f5; background: rgba(3,5,7,.97); border-radius: 2px;
  font-size: clamp(10px, 1.05vw, 18px); font-weight: 600; letter-spacing: .04em;
  font-variant-numeric: tabular-nums; z-index: 3;
}
#discord-label {
  position: fixed; right: 3.2%; bottom: 8.8%; width: 14.3%; height: 2.5%;
  min-height: 15px; display: flex; align-items: center; justify-content: flex-end;
  padding-right: .2%; color: #ff2338; background: rgba(4,5,7,.98);
  font-size: clamp(10px, 1.02vw, 17px); font-weight: 500; letter-spacing: .02em;
  white-space: nowrap; z-index: 3;
}
@media (max-aspect-ratio: 4/3) {
  /* Preserve the artwork proportions on tall windows; the background may crop slightly. */
  #artwork { object-fit: cover; object-position: center; }
  #progress-track, #progress-percent, #discord-label { display: none; }
}
@media (prefers-reduced-motion: reduce) { #progress-fill { transition: none; } }
</style>
</head>
<body>
<img id="artwork" src="chaos_rising_loading_art.png" alt="Loading screen Chaos Rising DarkRP">
<div id="progress-track" role="progressbar" aria-label="Progression visuelle du chargement" aria-valuemin="0" aria-valuemax="100" aria-valuenow="7">
  <div id="progress-fill"></div>
</div>
<div id="progress-percent" aria-live="off">07%</div>
<div id="discord-label">discord.gg/XXXXXX</div>
<script>
(() => {
  'use strict';

  // Option Imgur : remplace la ligne ci-dessous par le lien direct de l'image,
  // par exemple : https://i.imgur.com/IDENTIFIANT.png
  const BACKGROUND_URL = 'chaos_rising_loading_art.png';
  const artwork = document.getElementById('artwork');
  if (BACKGROUND_URL) artwork.src = BACKGROUND_URL;

  const fill = document.getElementById('progress-fill');
  const percent = document.getElementById('progress-percent');
  const track = document.getElementById('progress-track');
  const stages = [
    [18, 'Initialisation'],
    [42, 'Téléchargement'],
    [67, 'Synchronisation'],
    [84, 'Configuration'],
    [94, 'Finalisation']
  ];
  let value = 7;

  function renderProgress() {
    fill.style.width = value + '%';
    percent.textContent = String(value).padStart(2, '0') + '%';
    track.setAttribute('aria-valuenow', String(value));
  }

  function tick() {
    if (value < 94) {
      value = Math.min(94, value + (Math.random() < 0.22 ? 1 : 2));
      renderProgress();
    }
    const delay = value >= 94 ? 1800 : 300 + Math.random() * 450;
    window.setTimeout(tick, delay);
  }

  // Si l'image distante échoue, l'image locale incluse dans l'archive reste disponible.
  artwork.addEventListener('error', () => {
    if (artwork.src !== new URL('chaos_rising_loading_art.png', location.href).href) {
      artwork.src = 'chaos_rising_loading_art.png';
    }
  });

  renderProgress();
  window.setTimeout(tick, 500);
})();
</script>
</body>
</html>
