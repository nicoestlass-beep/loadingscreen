<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a0e">
<title>Chaos Rising — DarkRP</title>
<style>
  :root {
    --bg: #080a0e;
    --panel: #0e1118;
    --text: #f4f5f7;
    --muted: #858b98;
    --red: #e52b3c;
    --red-soft: rgba(229, 43, 60, .16);
    --line: rgba(255,255,255,.09);
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    overflow: hidden;
    color: var(--text);
    background:
      radial-gradient(ellipse at 50% 44%, rgba(31, 39, 54, .38) 0%, transparent 48%),
      radial-gradient(ellipse at 82% 16%, rgba(229, 43, 60, .075) 0%, transparent 28%),
      var(--bg);
    font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Décor intégralement dessiné en CSS : aucune image de fond, aucune dépendance. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at center, black 8%, transparent 78%);
    opacity: .42;
  }
  body::after {
    content: ""; position: fixed; left: 50%; top: 50%; width: min(68vw, 760px); aspect-ratio: 1;
    transform: translate(-50%, -50%); border: 1px solid rgba(255,255,255,.035); border-radius: 50%;
    box-shadow: 0 0 0 72px rgba(255,255,255,.012), 0 0 0 144px rgba(255,255,255,.009);
    pointer-events: none;
  }
  .screen { position: relative; z-index: 1; width: 100%; height: 100%; min-height: 430px; display: flex; flex-direction: column; padding: clamp(22px, 4vw, 54px); }
  .topbar, .footer { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .brand-mini { display: flex; align-items: center; gap: 12px; }
  .mark { width: 39px; height: 39px; display: grid; place-items: center; border: 1px solid rgba(229,43,60,.65); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: -.06em; position: relative; }
  .mark::after { content: ""; position: absolute; width: 5px; height: 5px; right: -3px; bottom: -3px; background: var(--red); box-shadow: 0 0 16px var(--red); }
  .mini-name { font-size: 12px; letter-spacing: .19em; font-weight: 750; text-transform: uppercase; }
  .mini-sub { margin-top: 4px; font-size: 9px; letter-spacing: .28em; color: var(--muted); text-transform: uppercase; }
  .server-tag { color: #a4a9b3; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; text-align: right; }
  .server-tag span { display: block; margin-top: 6px; color: #5e6470; font-size: 9px; letter-spacing: .2em; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 35px 0; }
  .hero { width: min(690px, 100%); text-align: center; transform: translateY(-1.5%); animation: reveal .9s cubic-bezier(.2,.7,.2,1) both; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; color: #a0a5af; font-size: 10px; font-weight: 650; letter-spacing: .3em; text-transform: uppercase; }
  .eyebrow::before, .eyebrow::after { content: ""; width: 24px; height: 1px; background: var(--red); opacity: .8; }
  h1 { margin: 22px 0 0; font-size: clamp(39px, 7.1vw, 82px); font-weight: 280; letter-spacing: .13em; line-height: 1.04; text-transform: uppercase; }
  h1 .accent { color: var(--red); font-weight: 650; }
  .subtitle { margin-top: 17px; color: #9ca2ad; font-size: clamp(10px, 1.4vw, 12px); letter-spacing: .34em; text-transform: uppercase; }
  .separator { width: 42px; height: 2px; background: var(--red); margin: 28px auto 31px; box-shadow: 0 0 18px rgba(229,43,60,.4); }
  .loading { width: min(430px, 100%); margin: 0 auto; text-align: left; }
  .loading-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .loading-label { color: #dfe1e6; font-size: 10px; font-weight: 650; letter-spacing: .19em; text-transform: uppercase; }
  .percent { color: #fff; font-variant-numeric: tabular-nums; font-size: 11px; letter-spacing: .12em; }
  .track { height: 3px; width: 100%; background: rgba(255,255,255,.11); overflow: hidden; }
  .fill { width: 0%; height: 100%; background: linear-gradient(90deg, #b91e2e, var(--red)); box-shadow: 0 0 14px rgba(229,43,60,.65); transition: width .42s ease; position: relative; }
  .fill::after { content: ""; position: absolute; right: 0; top: -3px; width: 22px; height: 9px; background: rgba(255,255,255,.55); filter: blur(7px); }
  .status { min-height: 17px; margin-top: 12px; color: #747b88; font-size: 10px; letter-spacing: .04em; }
  .status::before { content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 9px 1px 0; border-radius: 50%; background: var(--red); box-shadow: 0 0 9px var(--red); animation: pulse 1.8s ease-in-out infinite; }
  .footer { padding-top: 22px; border-top: 1px solid var(--line); }
  .discord { color: #e7e8eb; font-size: 11px; letter-spacing: .12em; text-decoration: none; }
  .discord b { color: var(--red); font-weight: 700; }
  .footer-note { color: #626875; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; text-align: right; }
  .footer-note::before { content: ""; display: inline-block; vertical-align: middle; width: 5px; height: 5px; margin-right: 9px; background: #49b783; border-radius: 50%; box-shadow: 0 0 8px rgba(73,183,131,.5); }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes reveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(-1.5%); } }
  @media (max-width: 560px) {
    .screen { padding: 20px; }
    .server-tag { font-size: 8px; letter-spacing: .12em; }
    .server-tag span { font-size: 8px; }
    h1 { letter-spacing: .075em; }
    .subtitle { letter-spacing: .18em; }
    .footer-note { max-width: 130px; line-height: 1.7; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="screen">
  <header class="topbar">
    <div class="brand-mini">
      <div class="mark" aria-hidden="true">CR</div>
      <div><div class="mini-name">Chaos Rising</div><div class="mini-sub">Roleplay experience</div></div>
    </div>
    <div class="server-tag">Garry's Mod <span>DarkRP · Connexion sécurisée</span></div>
  </header>

  <main>
    <section class="hero" aria-label="Chargement du serveur">
      <div class="eyebrow">Bienvenue sur le serveur</div>
      <h1>Chaos <span class="accent">Rising</span></h1>
      <div class="subtitle">Une ville. Des histoires. Votre rôle.</div>
      <div class="separator"></div>
      <div class="loading">
        <div class="loading-head"><span class="loading-label">Connexion en cours</span><span class="percent" id="percent">0%</span></div>
        <div class="track" role="progressbar" aria-label="Progression du chargement" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressbar"><div class="fill" id="fill"></div></div>
        <div class="status" id="status">Préparation de votre arrivée...</div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="discord">DISCORD <b>·</b> discord.gg/razJsGPPp</div>
    <div class="footer-note">Préparation de la session</div>
  </footer>
</div>
<script>
(() => {
  const fill = document.getElementById('fill');
  const percent = document.getElementById('percent');
  const status = document.getElementById('status');
  const bar = document.getElementById('progressbar');
  let total = 0, needed = 0, current = 0, gotRealProgress = false;
  let previewTimer = null;

  function setProgress(value) {
    const n = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
    current = Math.max(current, n);
    fill.style.width = current + '%';
    percent.textContent = current + '%';
    bar.setAttribute('aria-valuenow', String(current));
    if (current >= 100) status.textContent = 'Connexion terminée. Bon jeu !';
  }
  function setStatus(value) {
    if (typeof value === 'string' && value.trim()) status.textContent = value;
  }

  // Callbacks utilisés par l'écran de chargement de Garry's Mod.
  window.SetFilesTotal = function(value) { gotRealProgress = true; total = Math.max(0, Number(value) || 0); updateFiles(); };
  window.SetFilesNeeded = function(value) { gotRealProgress = true; needed = Math.max(0, Number(value) || 0); updateFiles(); };
  window.DownloadingFile = function(file) {
    gotRealProgress = true;
    if (typeof file === 'string' && file.length) setStatus('Téléchargement : ' + file.split('/').pop());
    else setStatus('Téléchargement des ressources...');
  };
  window.SetStatusChanged = function(value) { gotRealProgress = true; setStatus(value); };
  window.GameDetails = function(servername, serverurl, mapname) {
    gotRealProgress = true;
    setStatus(mapname ? 'Chargement de la carte : ' + mapname : 'Connexion au serveur...');
  };
  window.SetLoadingProgress = function(value) { gotRealProgress = true; setProgress(value <= 1 ? value * 100 : value); };

  function updateFiles() {
    if (total > 0) setProgress(((total - needed) / total) * 100);
    else if (needed === 0 && total === 0) setStatus('Préparation des ressources...');
  }

  // En aperçu navigateur, animation discrète. En jeu, les callbacks réels prennent le relais.
  function startPreview() {
    let preview = 0;
    previewTimer = window.setInterval(() => {
      if (gotRealProgress) { window.clearInterval(previewTimer); return; }
      if (preview < 91) {
        preview += preview < 55 ? 2 : preview < 78 ? 1 : .35;
        setProgress(preview);
        if (preview < 25) setStatus('Initialisation du serveur...');
        else if (preview < 58) setStatus('Chargement des ressources...');
        else if (preview < 82) setStatus('Préparation de votre arrivée...');
        else setStatus('Finalisation de la connexion...');
      }
    }, 180);
  }
  startPreview();
})();
</script>
</body>
</html>
