<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Rising — Chargement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Écran de chargement Nova Rising — style « NOVA cartoon premium » (le même que les addons du serveur).
   Volontairement simple : pas de variables CSS ni de JavaScript moderne, pour marcher aussi sur les anciens
   navigateurs intégrés de Garry's Mod. Toutes les images sont dans le dossier assets/. */
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body {
  background: #2a1e6e url("assets/fond.png") center bottom / cover no-repeat;
  color: #ffffff;
  font-family: "Nunito", "Segoe UI", Arial, sans-serif;
  font-weight: 800;
}
/* la ville respire doucement */
.city { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: url("assets/fond.png") center bottom / cover no-repeat;
  -webkit-animation: respire 24s ease-in-out infinite; animation: respire 24s ease-in-out infinite; }
@-webkit-keyframes respire { 0%,100% { -webkit-transform: scale(1); } 50% { -webkit-transform: scale(1.04); } }
@keyframes respire { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }

/* nuages, voitures et pigeons : de vraies images qui bougent */
.nuage { z-index: 2; position: fixed; width: 300px; -webkit-animation: vent linear infinite; animation: vent linear infinite; }
.n1 { top: 2%; -webkit-animation-duration: 70s; animation-duration: 70s; }
.n2 { top: 40%; width: 210px; -webkit-animation-duration: 95s; animation-duration: 95s; -webkit-animation-delay: -40s; animation-delay: -40s; }
.n3 { top: 47%; width: 170px; -webkit-animation-duration: 120s; animation-duration: 120s; -webkit-animation-delay: -80s; animation-delay: -80s; }
@-webkit-keyframes vent { from { left: -340px; } to { left: 105%; } }
@keyframes vent { from { left: -340px; } to { left: 105%; } }
.voiture { z-index: 3; position: fixed; width: 150px; bottom: 9.5%; -webkit-animation: rouler linear infinite; animation: rouler linear infinite; }
.v1 { -webkit-animation-duration: 14s; animation-duration: 14s; }
.v2 { bottom: 4%; width: 170px; -webkit-transform: scaleX(-1); transform: scaleX(-1); -webkit-animation-name: rouler2; animation-name: rouler2; -webkit-animation-duration: 18s; animation-duration: 18s; -webkit-animation-delay: -6s; animation-delay: -6s; }
@-webkit-keyframes rouler { from { left: -200px; } to { left: 105%; } }
@keyframes rouler { from { left: -200px; } to { left: 105%; } }
@-webkit-keyframes rouler2 { from { left: 105%; } to { left: -200px; } }
@keyframes rouler2 { from { left: 105%; } to { left: -200px; } }
.pigeon { z-index: 2; position: fixed; width: 64px; top: 42%; -webkit-animation: voler 26s linear infinite; animation: voler 26s linear infinite; }
.p2 { top: 45%; width: 48px; -webkit-animation-delay: -9s; animation-delay: -9s; }
@-webkit-keyframes voler { 0% { left: 105%; margin-top: 0; } 25% { margin-top: -30px; } 50% { margin-top: 10px; } 75% { margin-top: -20px; } 100% { left: -100px; margin-top: 0; } }
@keyframes voler { 0% { left: 105%; margin-top: 0; } 25% { margin-top: -30px; } 50% { margin-top: 10px; } 75% { margin-top: -20px; } 100% { left: -100px; margin-top: 0; } }

/* en-tête : logo et étiquette du serveur */
.top { position: fixed; left: 36px; top: 30px; right: 36px; z-index: 5; }
.marque { float: left; }
.marque img { width: 74px; height: 74px; float: left; -webkit-animation: tangue 3s ease-in-out infinite; animation: tangue 3s ease-in-out infinite; }
@-webkit-keyframes tangue { 0%,100% { -webkit-transform: rotate(-6deg); } 50% { -webkit-transform: rotate(6deg); } }
@keyframes tangue { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.marque .nom { float: left; margin: 8px 0 0 14px; }
.marque .nom b { display: block; font-family: "Lilita One", "Arial Black", "Nunito", Arial, sans-serif; font-weight: 400; font-size: 30px; letter-spacing: 1px; text-shadow: 3px 4px 0 #241640; }
.marque .nom span { display: block; font-size: 14px; color: #FFE68C; text-shadow: 2px 2px 0 #241640; }
.etiquette { float: right; background: #FFC83C; color: #241640; padding: 10px 22px; border-radius: 24px; font-size: 15px; box-shadow: 4px 6px 0 #8A5A08; }

/* le titre */
.titre { position: fixed; left: 0; right: 0; top: 17%; text-align: center; z-index: 5; }
.titre h1 { margin: 0; font-family: "Lilita One", "Arial Black", "Nunito", Arial, sans-serif; font-weight: 400; font-size: 96px; line-height: 1; letter-spacing: 2px;
  color: #ffffff; text-shadow: 6px 8px 0 #241640; -webkit-animation: rebond 2.6s ease-in-out infinite; animation: rebond 2.6s ease-in-out infinite; }
.titre h1 span { color: #FFC83C; }
.titre p { margin: 14px 0 0; font-size: 22px; color: #ffffff; text-shadow: 3px 3px 0 #241640; }
@-webkit-keyframes rebond { 0%,100% { -webkit-transform: translateY(0); } 50% { -webkit-transform: translateY(-8px); } }
@keyframes rebond { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

/* en bas au milieu : l'astuce du moment, puis la carte de chargement */
.bas { position: fixed; left: 50%; bottom: 22%; width: 640px; margin-left: -320px; z-index: 5; }
.astuce { position: relative; background: #ffffff; color: #241640; border-radius: 24px; padding: 18px 22px 18px 96px; min-height: 92px;
  box-shadow: 5px 7px 0 #7A4AB4; margin-bottom: 22px; -webkit-transition: opacity .35s, -webkit-transform .35s; transition: opacity .35s, transform .35s; }
.astuce.cache { opacity: 0; -webkit-transform: translateY(10px); transform: translateY(10px); }
.astuce img { position: absolute; left: 18px; top: 50%; width: 62px; height: 62px; margin-top: -31px; }
.astuce small { display: block; font-size: 13px; color: #C8467A; letter-spacing: 1px; }
.astuce div { font-size: 18px; line-height: 1.3; margin-top: 3px; }
.carte { background: #2E2A6E; border-radius: 26px; padding: 20px 24px 22px; box-shadow: 6px 8px 0 #FFC83C; }
.ligne { overflow: hidden; margin-bottom: 12px; }
.ligne .etat { float: left; font-size: 16px; max-width: 470px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ligne .pc { float: right; font-family: "Lilita One", "Arial Black", "Nunito", Arial, sans-serif; font-weight: 400; font-size: 26px; color: #FFC83C; }
.rail { height: 22px; background: #4A3C96; border-radius: 12px; overflow: hidden; }
.plein { height: 100%; width: 0%; background: #46DCA0; border-radius: 12px; -webkit-transition: width .5s ease; transition: width .5s ease; }
.infos { margin-top: 14px; overflow: hidden; }
.pastille { float: left; margin-right: 10px; background: #4A3C96; color: #ffffff; font-size: 14px; padding: 7px 16px; border-radius: 18px; }
.pastille.or { background: #FFC83C; color: #241640; }
.discord { z-index: 5; position: fixed; left: 50%; bottom: 3.5%; width: 340px; margin-left: -170px; text-align: center; background: #5865F2; color: #ffffff;
  padding: 12px 18px; border-radius: 24px; font-size: 16px; box-shadow: 4px 6px 0 #2E3699; }

/* petits écrans */
@media (max-width: 760px) {
  .titre h1 { font-size: 58px; } .titre p { font-size: 16px; }
  .bas { width: 92%; margin-left: -46%; bottom: 20%; } .etiquette { display: none; }
}
@media (prefers-reduced-motion: reduce) { .city, .nuage, .voiture, .pigeon, .titre h1, .marque img { -webkit-animation: none; animation: none; } }
</style>
</head>
<body>
<div class="city"></div>
<img class="nuage n1" src="assets/nuage.png" alt="">
<img class="nuage n2" src="assets/nuage.png" alt="">
<img class="nuage n3" src="assets/nuage.png" alt="">
<img class="pigeon" src="assets/pigeon.png" alt="">
<img class="pigeon p2" src="assets/pigeon.png" alt="">
<img class="voiture v1" src="assets/voiture.png" alt="">
<img class="voiture v2" src="assets/voiture.png" alt="">

<div class="top">
  <div class="marque"><img src="assets/logo.png" alt=""><div class="nom"><b>Nova Rising</b><span>Roleplay français</span></div></div>
  <div class="etiquette">Garry's Mod · DarkRP</div>
</div>

<div class="titre">
  <h1>Nova <span>Rising</span></h1>
  <p>Une ville. Des histoires. Ton rôle.</p>
</div>

<div class="bas">
  <div class="astuce" id="astuce"><img id="astuce-img" src="assets/parler.png" alt=""><small>LE SAVAIS-TU ?</small><div id="astuce-txt">Ici, on parle avant de tirer : maintiens G en regardant quelqu'un.</div></div>
  <div class="carte">
    <div class="ligne"><span class="etat" id="etat">Préparation de ton arrivée…</span><span class="pc" id="pc">0 %</span></div>
    <div class="rail"><div class="plein" id="plein"></div></div>
    <div class="infos"><span class="pastille or" id="carte">Ville de Nova</span><span class="pastille" id="fichiers">Connexion…</span></div>
  </div>
</div>

<div class="discord">Discord · discord.gg/razJsGPPp</div>

<script>
/* Les fonctions appelées par Garry's Mod pendant le chargement (JavaScript « à l'ancienne », compatible partout). */
(function () {
  var plein = document.getElementById("plein"), pc = document.getElementById("pc"), etat = document.getElementById("etat");
  var carte = document.getElementById("carte"), fichiers = document.getElementById("fichiers");
  var total = 0, restants = 0, actuel = 0, vrai = false;

  function progression(v) {
    var n = Math.max(0, Math.min(100, Math.round(Number(v) || 0)));
    if (n < actuel) return;
    actuel = n;
    plein.style.width = n + "%";
    pc.innerHTML = n + " %";
    if (n >= 100) etat.innerHTML = "C'est parti ! Bienvenue en ville.";
  }
  function texte(t) { if (typeof t === "string" && t.replace(/\s/g, "") !== "") etat.innerHTML = t.replace(/</g, "&lt;"); }
  function fichiersMaj() {
    if (total > 0) {
      progression(((total - restants) / total) * 100);
      fichiers.innerHTML = (total - restants) + " / " + total + " fichiers";
    }
  }
  window.GameDetails = function (serveur, url, map, maxjoueurs) {
    vrai = true;
    if (map) carte.innerHTML = String(map).replace(/</g, "&lt;");
    texte("Connexion à la ville…");
  };
  window.SetFilesTotal = function (v) { vrai = true; total = Math.max(0, Number(v) || 0); fichiersMaj(); };
  window.SetFilesNeeded = function (v) { vrai = true; restants = Math.max(0, Number(v) || 0); fichiersMaj(); };
  window.DownloadingFile = function (f) {
    vrai = true;
    var nom = (typeof f === "string" && f.length) ? f.split("/").pop() : "";
    texte(nom ? "Téléchargement : " + nom : "Téléchargement des ressources…");
  };
  window.SetStatusChanged = function (t) {
    vrai = true;
    var traduit = {
      "Workshop Complete": "Collection Workshop prête !",
      "Client info sent!": "Infos envoyées au serveur…",
      "Received all Lua files we needed!": "Tous les scripts sont reçus !",
      "No files to request!": "Rien de plus à télécharger.",
      "Sending client info...": "Envoi de tes infos…",
      "Starting Lua...": "Démarrage des scripts…",
      "Retrieving server info...": "Récupération des infos du serveur…"
    };
    texte(traduit[t] || t);
  };
  window.SetLoadingProgress = function (v) { vrai = true; progression(v <= 1 ? v * 100 : v); };

  /* Les astuces : elles tournent toutes les 6 secondes (et parlent des vrais systèmes du serveur) */
  var astuces = [
    ["parler.png", "Ici, on parle avant de tirer : maintiens G en regardant quelqu'un."],
    ["colombe.png", "Une bavure ? Excuse-toi (roue G) pour récupérer ta réputation."],
    ["chat.png", "Le Bureau des petits boulots paie pour sauver les chats perchés."],
    ["plaque.png", "Gare ta voiture devant la préfecture pour l'immatriculer."],
    ["cle.png", "En panne ? Le dépanneur voit la pièce cassée et la répare en mini-jeu."],
    ["rdv.png", "Petites annonces : réponds, et donnez-vous rendez-vous en ville."],
    ["pigeon.png", "Un pigeon voyageur s'est échappé ? Approche-toi doucement…"],
    ["logo.png", "Les Citoyens modèles touchent une prime toutes les 20 minutes."]
  ];
  var i = 0, boite = document.getElementById("astuce"), img = document.getElementById("astuce-img"), txt = document.getElementById("astuce-txt");
  setInterval(function () {
    boite.className = "astuce cache";
    setTimeout(function () {
      i = (i + 1) % astuces.length;
      img.src = "assets/" + astuces[i][0];
      txt.innerHTML = astuces[i][1];
      boite.className = "astuce";
    }, 380);
  }, 6000);

  /* Dans un navigateur (aperçu GitHub), une petite progression pour voir le rendu ; en jeu, Garry's Mod prend le relais. */
  var apercu = 0;
  var minuteur = setInterval(function () {
    if (vrai) { clearInterval(minuteur); return; }
    if (apercu < 92) {
      apercu += apercu < 50 ? 2 : (apercu < 80 ? 1 : 0.3);
      progression(apercu);
      texte(apercu < 30 ? "Initialisation du serveur…" : (apercu < 60 ? "Chargement des ressources…" : (apercu < 85 ? "Préparation de ton arrivée…" : "Presque prêt…")));
    }
  }, 180);
})();
</script>
</body>
</html>
